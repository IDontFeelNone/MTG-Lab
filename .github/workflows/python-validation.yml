name: Python validation

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify validation scope
        id: scope
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_merge_tree.py
      - run: python -m pip install --upgrade pip
        if: steps.scope.outputs.full == 'true'
      - run: python -m pip install -r requirements.txt
        if: steps.scope.outputs.full == 'true'
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        if: steps.scope.outputs.full == 'true'
        env:
          PYTHONPATH: src
      - name: Real publication validation against disposable writer expansion
        if: steps.scope.outputs.full == 'true'
        run: python tests/publication_validation_regression.py
        env:
          PYTHONPATH: src:tests
