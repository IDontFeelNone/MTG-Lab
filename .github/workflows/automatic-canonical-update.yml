name: Automatic canonical update

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Planning grants no approval. Admission explicitly authorizes the reviewed plan.
        type: choice
        options: [plan, admit]
        default: plan
        required: true
      config:
        description: Reviewed file under config/automatic_updates (no private paths)
        required: true
        default: config/automatic_updates/mb2-first-batch.json
      expected_plan_id:
        description: For admission, exact plan_id from previously reviewed planning output
        required: false
        default: ''
      reviewed_revision:
        description: For admission, exact main workflow/code SHA from that reviewed plan
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: owner-catalog-admission
  cancel-in-progress: false

# Publication is reachable only after authenticated admission and required validation.
# Planning cannot publish; no PR approval or merge exists in this path.
jobs:
  plan:
    if: inputs.operation == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read-only plan (never execute or publish)
        env:
          PYTHONPATH: src
          UPDATE_CONFIG: ${{ inputs.config }}
          EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
        run: |
          python scripts/automatic_canonical_update.py plan --github-owner-entry "--config=$UPDATE_CONFIG" > automatic-update-plan.json
          if [ -n "$EXPECTED_PLAN_ID" ]; then
            python scripts/automatic_canonical_update.py plan --github-owner-entry "--config=$UPDATE_CONFIG" "--expected-plan-id=$EXPECTED_PLAN_ID" > automatic-update-plan-recheck.json
          fi
          git diff --check
      - name: Retain planning diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: automatic-update-plan*.json
          if-no-files-found: warn

  admit:
    if: inputs.operation == 'admit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Explicit owner action for the previously reviewed plan
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          UPDATE_CONFIG: ${{ inputs.config }}
          EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        with:
          script: |
            const fs = require('fs');
            const {spawnSync} = require('child_process');
            try {
              const token = await core.getIDToken('mtg-lab:canonical-admission');
              core.setSecret(token);
              const result = spawnSync('python', [
                'scripts/automatic_canonical_update.py', 'admit', '--github-owner-entry', '--publish-admission-pr',
                '--config=' + process.env.UPDATE_CONFIG,
                '--expected-plan-id=' + process.env.EXPECTED_PLAN_ID,
                '--reviewed-revision=' + process.env.REVIEWED_REVISION
              ], {encoding: 'utf8', shell: false,
                  env: {...process.env, MTG_LAB_ADMISSION_OIDC: token}});
              let report;
              try {
                report = JSON.parse(result.stdout);
                if (!report || !['blocked', 'published'].includes(report.status)) throw new Error();
              } catch (error) {
                report = {status: 'blocked', error: 'Entry point produced no valid structured report'};
              }
              const serialized = JSON.stringify(report);
              fs.writeFileSync('automatic-update-result.json', serialized);
              core.info(serialized);
              if (result.status !== 0 || report.status !== 'published') core.setFailed('Owner admission entry point blocked; inspect its report');
            } catch (error) {
              fs.writeFileSync('automatic-update-result.json', JSON.stringify({status: 'blocked', error: 'GitHub platform identity acquisition failed'}));
              core.setFailed('GitHub platform identity acquisition failed');
            }
      - name: Check delta formatting
        run: git diff --check
      - name: Retain bounded entry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-admission-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: automatic-update-result.json
          if-no-files-found: warn
