name: MTGJSON production ingestion

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Approved AllPrintings URL
        required: true
        default: https://mtgjson.com/api/v5/AllPrintings.json
      expected_sha256:
        description: Reviewed SHA-256 (64 hexadecimal characters)
        required: true
      maximum_batch_size:
        description: Maximum dependency-closed batch size
        required: true
        default: "1000"
      selected_batch:
        description: Exact deterministic batch ID (required for promotion)
        required: false
      mode:
        description: Execution mode
        required: true
        type: choice
        default: dry-run
        options: [dry-run, reviewed-promotion]
      reviewer:
        description: Independent reviewer identity (promotion only)
        required: false
      review_reference:
        description: Immutable review/ticket reference (promotion only)
        required: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate bounded request
        env:
          MODE: ${{ inputs.mode }}
          BATCH: ${{ inputs.selected_batch }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
          SHA256: ${{ inputs.expected_sha256 }}
          BATCH_SIZE: ${{ inputs.maximum_batch_size }}
        run: |
          python - <<'PY'
          import os
          sha = os.environ["SHA256"].strip().lower()
          if len(sha) != 64 or any(c not in "0123456789abcdef" for c in sha):
              raise SystemExit("A valid caller-supplied SHA-256 is required")
          if int(os.environ["BATCH_SIZE"]) <= 0:
              raise SystemExit("maximum_batch_size must be positive")
          if os.environ["MODE"] == "reviewed-promotion" and not all(
              os.environ[x].strip() for x in ("BATCH", "REVIEWER", "REVIEW_REFERENCE")):
              raise SystemExit("Promotion requires one batch, reviewer, and review reference")
          PY
      - name: Download to runner temporary storage
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/AllPrintings.json" "$SOURCE_URL"
      - name: Plan corpus or promote one reviewed batch
        env:
          PYTHONPATH: src
          MODE: ${{ inputs.mode }}
          SHA256: ${{ inputs.expected_sha256 }}
          BATCH_SIZE: ${{ inputs.maximum_batch_size }}
          BATCH: ${{ inputs.selected_batch }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          mkdir -p "$RUNNER_TEMP/mtg-lab-state"
          args=(--data-root "$RUNNER_TEMP/mtg-lab-state" --batch-size "$BATCH_SIZE")
          if [[ "$MODE" == "dry-run" ]]; then
            selected=()
            if [[ -n "$BATCH" ]]; then selected=(--batch "$BATCH"); fi
            python scripts/mtgjson_delivery.py "${args[@]}" plan --source "$RUNNER_TEMP/AllPrintings.json" --sha256 "$SHA256" "${selected[@]}" > "$RUNNER_TEMP/run-result.json"
          else
            python scripts/mtgjson_delivery.py "${args[@]}" promote --source "$RUNNER_TEMP/AllPrintings.json" --sha256 "$SHA256" --batch "$BATCH" --reviewer "$REVIEWER" --review-reference "$REVIEW_REFERENCE" > "$RUNNER_TEMP/run-result.json"
          fi
      - name: Write job summary
        if: always()
        run: |
          echo '## MTGJSON production ingestion' >> "$GITHUB_STEP_SUMMARY"
          echo '* Mode: `${{ inputs.mode }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '* Source data remained in runner-temporary storage.' >> "$GITHUB_STEP_SUMMARY"
          echo '* No commit, pull request, or unselected batch promotion was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload safe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtgjson-ingestion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mtg-lab-state/reports/
            ${{ runner.temp }}/mtg-lab-state/evidence/mtgjson/production-batches/**/manifest.json
            ${{ runner.temp }}/mtg-lab-state/evidence/mtgjson/production-batches/**/review-package.json
            ${{ runner.temp }}/run-result.json
          if-no-files-found: warn
          retention-days: 30
